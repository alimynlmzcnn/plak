<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plak</title>
<style>
  :root { color-scheme: dark; --glow: 200, 200, 210; --b: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif; }

  /* ---------- fotoğraf arka plan ---------- */
  .photo { position: fixed; inset: 0; background-size: cover; background-position: center; opacity: 0;
    transition: opacity 1.6s ease; z-index: 0; animation: drift 50s ease-in-out infinite alternate; }
  .photo.on { opacity: 1; }
  @keyframes drift { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.14) translate(-1.5%, -1%); } }
  #shade { position: fixed; inset: 0; background: #000; opacity: .42; z-index: 0; pointer-events: none; }
  #vig { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.8) 100%); }
  #credit { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: 36vw; z-index: 1; font-size: 11px;
    color: rgba(255,255,255,.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  #status { position: fixed; left: 0; right: 0; top: 50%; text-align: center; z-index: 1; font: italic clamp(16px, 2vw, 22px) Georgia, serif;
    color: rgba(255,255,255,.45); transition: opacity .5s; pointer-events: none; padding: 0 8vw; }
  #now { position: fixed; top: 22px; left: 0; right: 0; text-align: center; font-size: 13px; z-index: 1;
    color: rgba(255,255,255,.4); letter-spacing: .03em; pointer-events: none; }

  /* ---------- kelime ---------- */
  .word { position: absolute; left: 0; top: 0; width: max-content; will-change: transform;
    transition: opacity 1.25s ease-out, filter 1.25s ease-out; }
  .word.out { opacity: 0; filter: blur(3px); }
  .fx { display: block; white-space: nowrap; color: #fff; line-height: 1;
    text-shadow: 0 2px 26px rgba(0,0,0,.5), 0 0 calc(14px + var(--b) * 26px) rgba(var(--glow), .6), 0 0 calc(46px + var(--b) * 54px) rgba(var(--glow), .32); }
  .fx.big { font-family: Impact, Haettenschweiler, "Franklin Gothic Heavy", "Arial Black", sans-serif; font-weight: 400;
    text-transform: uppercase; letter-spacing: .01em; }
  .fx.small { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-style: italic; font-weight: 400; }
  .ch { display: inline-block; }

  .fx-slam    { animation: slam .28s cubic-bezier(.2,.9,.2,1) both; }
  .fx-drop .ch   { animation: drop .32s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--i) * 28ms); }
  .fx-stretch { animation: stretch .45s cubic-bezier(.15,.8,.2,1) both; }
  .fx-rise    { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .fx-flip    { animation: flip .36s cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 100%; }
  .fx-scatter .ch { animation: scatter .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 14ms); }
  .fx-type .ch   { opacity: 0; animation: show 0s forwards; animation-delay: calc(var(--i) * 32ms); }
  .fx-shake   { animation: shakeIn .4s linear both; }

  @keyframes slam { from { transform: scale(1.5); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: blur(0); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-.6em); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes stretch { from { letter-spacing: .5em; opacity: 0; } to { letter-spacing: .02em; opacity: 1; } }
  @keyframes rise { from { transform: translateY(28px); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: blur(0); } }
  @keyframes flip { from { transform: perspective(600px) rotateX(-80deg); opacity: 0; } to { transform: perspective(600px) rotateX(0); opacity: 1; } }
  @keyframes scatter { from { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.4); opacity: 0; filter: blur(5px); } to { transform: none; opacity: 1; filter: blur(0); } }
  @keyframes show { to { opacity: 1; } }
  @keyframes shakeIn { 0% { opacity: 0; transform: scale(1.35); } 20% { opacity: 1; transform: translate(-6px, 3px) scale(1.12); } 40% { transform: translate(5px, -4px) scale(1.06); }
    65% { transform: translate(-3px, 2px); } 100% { transform: none; } }

  /* ---------- plak ---------- */
  #rec { position: fixed; left: -120px; bottom: -120px; width: 440px; height: 440px; border-radius: 50%; z-index: 3;
    touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #rec.drag { cursor: grabbing; }
  #wheel { position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, #000 0 15%, transparent 15.4%),
      conic-gradient(from 20deg, transparent 0 7%, rgba(255,255,255,.05) 11%, transparent 15%, transparent 57%, rgba(255,255,255,.05) 61%, transparent 65%),
      repeating-radial-gradient(circle, #050505 0 2px, #151515 3px 4px), #070707;
    box-shadow: 0 0 0 1px #262626, 0 10px 60px rgba(0,0,0,.8); }
  #rec.playing #wheel { box-shadow: 0 0 0 1px #2e2e2e, 0 10px 60px rgba(0,0,0,.8); }
  #wheel::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(from -.4deg, rgba(255,255,255,.3) 0 .8deg, transparent .8deg 15deg);
    -webkit-mask: radial-gradient(circle closest-side, transparent 0 88%, #000 89% 95%, transparent 96%);
    mask: radial-gradient(circle closest-side, transparent 0 88%, #000 89% 95%, transparent 96%); }
  #sheen { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; 
    background: conic-gradient(from 0deg, transparent 0 18%, rgba(255,255,255,.07) 25%, transparent 32%, transparent 68%, rgba(255,255,255,.07) 75%, transparent 82%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #hub { position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    background: #000; border: 1px solid rgba(255,255,255,.22); display: grid; place-items: center; pointer-events: none; }
  #hub i { width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: .85; }
  #rec:not(.playing):not(.scrub) #hub i { width: 0; height: 0; background: none; border-radius: 0; opacity: 1;
    border-style: solid; border-width: 8px 0 8px 13px; border-color: transparent transparent transparent rgba(255,255,255,.8); margin-left: 4px; }
  #cover { position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    background: #000 center / cover no-repeat; opacity: 0; transition: opacity .5s; pointer-events: none; }
  #cover.on { opacity: 1; }
  #hub.cv { background: transparent; }
  #hub.cv i { box-shadow: 0 0 0 2px rgba(0,0,0,.55); }
  #rec:not(.playing):not(.scrub) #hub.cv i { filter: drop-shadow(0 0 3px rgba(0,0,0,.9)); }
  #needle { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: rotate(45deg); pointer-events: none; }
  #needle b { position: absolute; left: -1px; top: -246px; width: 2px; height: 30px; background: #fff; border-radius: 2px;
    box-shadow: 0 0 10px rgba(255,255,255,.8); }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 14px; cursor: pointer; z-index: 3; }
  #bar div { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: rgba(255,255,255,.75); }
  #adds { position: fixed; right: 20px; bottom: 22px; display: flex; gap: 10px; z-index: 3; }
  #adds button { font: 14px system-ui, sans-serif; color: rgba(255,255,255,.75); background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  #adds button:hover, #adds button:focus-visible { color: #fff; border-color: rgba(255,255,255,.6); outline: none; }
  #bgWrap { position: relative; }
  #bgMenu { position: absolute; right: 0; bottom: calc(100% + 8px); display: flex; flex-direction: column; gap: 4px; min-width: 190px;
    padding: 6px; border-radius: 16px; background: rgba(0,0,0,.72); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(8px); }
  #bgMenu[hidden] { display: none; }
  #bgMenu button { white-space: nowrap; border: 0 !important; background: transparent !important; text-align: left; border-radius: 10px !important; padding: 9px 14px !important; }
  #bgMenu button:hover, #bgMenu button:focus-visible { background: rgba(255,255,255,.12) !important; }
  #toast { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 4; font: 13px system-ui, sans-serif; color: #fff;
    background: rgba(0,0,0,.65); padding: 8px 14px; border-radius: 999px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  /* ---------- şarkı listesi (minimal) ---------- */
  #list { position: fixed; top: 16px; right: 20px; z-index: 5; text-align: right; font: 13px system-ui, sans-serif; }
  #listBtn { font: 13px system-ui, sans-serif; color: rgba(255,255,255,.6); background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  #listBtn:hover, #listBtn:focus-visible, #list.open #listBtn { color: #fff; border-color: rgba(255,255,255,.55); outline: none; }
  #songs { display: none; margin-top: 8px; width: 240px; max-height: 60vh; overflow-y: auto; padding: 6px; text-align: left;
    background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #list.open #songs { display: block; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,.55); }
  .row::before { content: ""; flex: none; width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .row:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.9); }
  .row.on { color: #fff; }
  .row.on::before { background: #fff; }
  .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .x { flex: none; font: 15px/1 system-ui, sans-serif; color: rgba(255,255,255,.7); background: none; border: 0;
    border-radius: 999px; padding: 2px 6px; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .row:hover .x, .row .x:focus-visible, .row .x.arm { opacity: 1; }
  .row .x.arm { font-size: 12px; color: #fff; background: rgba(255,90,80,.55); }
  @media (hover: none) { .row .x { opacity: .5; } }
  .row { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .row.hole { visibility: hidden; }
  .row.ghost { position: fixed; z-index: 20; margin: 0; pointer-events: none; font: 13px system-ui, sans-serif; color: #fff;
    background: rgba(40,40,48,.95); border: 1px solid rgba(255,255,255,.3); box-shadow: 0 12px 30px rgba(0,0,0,.6); transform: scale(1.04); cursor: grabbing; }
  .row.ghost .x { display: none; }
  .row.ghost .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list.sorting, #list.sorting * { cursor: grabbing; }
  #list.sorting .row:hover { background: none; }
  #addSong { display: block; width: 100%; margin-top: 4px; padding: 8px; background: none; border: 0;
    border-top: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.6); text-align: left; cursor: pointer; font: 13px system-ui, sans-serif; }
  #addSong:hover, #addSong:focus-visible { color: #fff; outline: none; }
  #drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.85); z-index: 9; font-size: 24px; }
  #drop.show { display: grid; }
  #drop { white-space: pre-line; text-align: center; line-height: 1.6; }
  body.dragimg #rec { z-index: 10; }
  #rec.dropt #wheel { box-shadow: 0 0 0 3px rgba(255,255,255,.75), 0 0 40px rgba(255,255,255,.25); }
  @media (max-width: 700px) { #rec { transform: scale(.72); transform-origin: 0 100%; left: -80px; bottom: -80px; } }
  @media (prefers-reduced-motion: reduce) { .photo { animation: none; } .fx, .fx .ch { animation: none !important; opacity: 1 !important; } }
</style>
</head>
<body>

<div class="photo" id="pA"></div>
<div class="photo" id="pB"></div>
<div id="shade"></div>
<div id="vig"></div>
<div id="stage"></div>
<div id="status"></div>
<div id="now"></div>
<div id="credit"></div>

<div id="rec" title="Plağı çevir: saat yönü ileri, ters yön geri sarar. Tıkla: durdur / oynat">
  <div id="wheel"></div>
  <div id="sheen"></div>
  <div id="cover"></div>
  <div id="hub"><i></i></div>
  <div id="needle"><b></b></div>
</div>

<div id="bar"><div id="fill"></div></div>
<div id="adds">
  <button id="tapB" type="button" title="Şarkı çalarken her kelime başlarken Enter'a bas (ya da ekrana dokun). Geri al: Backspace. Çıkış: Esc. Shift+tıkla: kayıtlı kelime zamanlarını sil">● Kelime kaydı</button>
  <div id="bgWrap">
    <div id="bgMenu" hidden>
      <button id="mCover" type="button">Kapak ekle</button>
      <button id="mCoverX" type="button" hidden>Kapağı kaldır</button>
      <button id="mBg" type="button">Arka plan ekle</button>
      <button id="mBgX" type="button" hidden>Arka planı kaldır</button>
    </div>
    <button id="addBg" type="button" title="Plağın kapağı ve arka plan">Görünüm</button>
  </div>
</div>
<div id="list">
  <button id="listBtn" type="button" title="Şarkı listesi">♫ 0</button>
  <div id="songs">
    <div id="rows"></div>
    <button id="addSong" type="button">+ şarkı ekle</button>
  </div>
</div>
<div id="toast"></div>
<input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.lrc" multiple hidden>
<input id="fileBg" type="file" accept="image/*" hidden>
<input id="fileCover" type="file" accept="image/*" hidden>
<div id="drop">Dosyaları bırak</div>

  rec.addEventListener("drop", e => {
    e.preventDefault(); e.stopPropagation(); endFileDrag();
    const files = [...e.dataTransfer.files], img = files.find(isImage), rest = files.filter(f => !isImage(f));
    if (img) setCover(img);
    if (rest.length) addFiles(rest);
  });

  /* ================= ortak şarkılar: songs/manifest.json'dan otomatik yükle ================= */
  async function loadShared() {
    let items;
    toast("Şarkılar kontrol ediliyor…");
    try { const r = await fetch("songs/manifest.json", { cache: "no-cache" }); if (!r.ok) { toast("manifest.json bulunamadı (" + r.status + ")"); return; } items = await r.json(); } catch (e) { toast("manifest.json okunamadı"); console.error(e); return; }
    if (!Array.isArray(items)) { toast("manifest.json formatı yanlış"); return; }
    const getCover = async (s, it) => {
      if (!it.cover || s.sharedCover) return;
      try { const r = await fetch("songs/" + encodeURIComponent(it.cover)); if (r.ok) { s.sharedCover = URL.createObjectURL(await r.blob()); if (!s.coverUrl) s.coverUrl = s.sharedCover; } } catch {}
    };
    let added = 0;
    for (const it of items) {
      try {
        if (!it || !it.file) continue;
        const name = it.title || it.file.replace(/\.[^.]+$/, "").replace(/_/g, " "), n = norm(name);
        const have = keyOrder.find(p => n.includes(p.key)) || slots.find(x => !x.key && x.base === n);
        if (have && have.url) { await getCover(have, it); continue; }   // şarkı zaten var, sadece kapağı al
        const s = have || slots.find((x, i) => i >= PRESETS.length && !x.url);
        if (!s) break;
        const r = await fetch("songs/" + encodeURIComponent(it.file)); if (!r.ok) { toast(it.file + " indirilemedi (" + r.status + ")"); continue; }
        const b = await r.blob();
        s.blob = b; s.url = URL.createObjectURL(b); s.base = n; s.lines = null;
        if (!s.key) s.title = name;
        if (it.lrc) { try { const lr = await fetch("songs/" + encodeURIComponent(it.lrc)); if (lr.ok) s.lines = parseLRC(await lr.text()); } catch {} }
        await getCover(s, it);
        save(slots.indexOf(s)); added++;
      } catch {}
    }
    if (loaded >= 0) applyCover(slots[loaded]);
    if (!added) return;
    renderList(); saveOrder();
    toast(added + " şarkı yüklendi");
    if (loaded < 0 && order.length) choose(order[0], false);
  }

  /* ================= başlangıç ================= */
  setWheel();
  setMessage("Şarkı dosyalarını (mp3) bu pencereye bırak.");
  restore().then(loadShared);
})();
</script>
